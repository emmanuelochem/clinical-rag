[project]
name = "clinical-rag"
version = "1.0.0"
description = "Clinical decision-support RAG: hybrid retrieval, reranking, agentic planning, evidence-cited differentials"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "lancedb>=0.25",
  "pyarrow>=16",
  "httpx>=0.27",
  "pydantic-settings>=2.4",
  "python-multipart>=0.0.9",
  "pymupdf>=1.24",
  "python-docx>=1.1",
  "beautifulsoup4>=4.12",
  "lxml>=5",
  "fastembed>=0.7",  # local embeddings + cross-encoder reranker (ONNX, CPU, no PyTorch)
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.setuptools.packages.find]
include = ["app*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
